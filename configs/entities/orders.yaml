entity: orders
bronze_table: bronze_sandbox.accelerator.orders
silver_table: silver_sandbox.accelerator.orders
audit_table: silver_sandbox.accelerator.audit_log
ingestion_audit_table: silver_sandbox.accelerator.ingestion_audit_log

extraction:
  mode: incremental        # full_scan | incremental
  filter_column: process_date

schema:
  - name: order_id
    type: integer
  - name: customer_id
    type: integer
  - name: amount
    type: double
  - name: status
    type: string
  - name: order_date
    type: timestamp
  - name: process_date
    type: date
  - name: is_deleted
    type: boolean

primary_keys:
  - order_id

deduplication:
  order_by:
    - column: order_date
      direction: desc
    - column: process_date
      direction: desc

soft_delete:
  enabled: true
  column: is_deleted
  value: true
  key_reconciliation:
    strategy: remove           # remove — physically deletes stale rows from silver
    frequency:
      type: monthly
      day_of_month: 1          # runs on the 1st of every month

dq_checks:
  - column: order_id
    type: not_null
  - column: customer_id
    type: not_null
  - column: amount
    type: not_null

transformations:
  - name: convert_to_est
    column: order_date       # UTC timestamp → America/New_York (EST/EDT); process_date is DateType — cannot convert
  - name: trim_right_zeros
    column: amount           # "100.50" → "100.5", "85.00" → "85" (bronze stores amount as string)
  - name: to_uppercase
    column: status           # "pending" → "PENDING"
