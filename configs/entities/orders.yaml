entity: orders
bronze_table: bronze_sandbox.accelerator.orders
silver_table: silver_sandbox.accelerator.orders
audit_table: silver_sandbox.accelerator.audit_log
ingestion_audit_table: silver_sandbox.accelerator.ingestion_audit_log

extraction:
  mode: incremental        # full_scan | incremental
  filter_column: process_date

schema:
  - name: order_id
    type: integer
  - name: customer_id
    type: integer
  - name: amount
    type: double
  - name: status
    type: string
  - name: order_date
    type: timestamp
  - name: process_date
    type: date
  - name: is_deleted
    type: boolean

primary_keys:
  - order_id

deduplication:
  order_by:
    - column: order_date
      direction: desc
    - column: process_date
      direction: desc

soft_delete:
  enabled: true
  column: is_deleted
  value: true

dq_checks:
  - column: order_id
    type: not_null
  - column: customer_id
    type: not_null
  - column: amount
    type: not_null

transformations:
  - name: EST_time
    column: process_date
  - name: trim_right_zeros
    params: [order_id,]
